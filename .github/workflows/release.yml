name: release

# 打 tag 即发布：推 v* 标签 → 编译 → 打包 → 建 GitHub Release 并上传产物。
# Release 正文来自 CHANGES.md 里对应版本的小节（见 packaging/changelog.py），
# 应用内更新弹窗渲染的就是这段文字。
# 也可以在 Actions 页手动触发（workflow_dispatch）：只编译打包、不建 Release，
# 用来验证「改了打包相关的东西之后还编不编得过」，不用先打一个废 tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（形如 v0.1.0；留空则用 pyproject.toml 里的）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.11
        # 锁死 3.11：qfluentwidgets 这个 fork 要求 PySide6<=6.4.2，而 6.4.2 没有
        # 3.12 的 wheel（见 CLAUDE.md 环境约束）
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ensure NSIS
        # runner 镜像是否自带 NSIS 各版本不一，找不到就用预装的 choco 装一个
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer and portable zip
        # 版本号经 env 传进来，不在 run 里直接插值——手动触发填的内容不该拼进命令行。
        # tag 触发用 tag 名；手动触发用输入框；两者都空就让 build.py 读 pyproject.toml。
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v) { $v = $env:TAG_NAME }
          if ($v) {
            uv run python packaging/build.py --installer --version $v
          } else {
            uv run python packaging/build.py --installer
          }

      - name: Upload artifacts
        # 手动触发时没有 Release 可传，产物挂到这次运行上供下载验证
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: BiliEmojiDD-build
          path: |
            dist/BiliEmojiDD-Setup-*.exe
            dist/BiliEmojiDD-*-win64.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/release_notes.md
          files: |
            dist/BiliEmojiDD-Setup-*.exe
            dist/BiliEmojiDD-*-win64.zip
            dist/SHA256SUMS.txt
