[project]
name = "bili-emoji-dd"
version = "0.1.0"
description = "B站表情包与收藏集下载器（PySide6 + QFluentWidgets + biliemoji）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biliemoji==2.0.0",
    "PySide6==6.4.2",
    "PySide6-Fluent-Widgets @ git+https://github.com/ldm0715/PyQt-Fluent-Widgets@PySide6",
    # requests 的 socks 支持（requests[socks]）：没它 socks5 代理直接抛 InvalidSchema
    "PySocks>=1.7.1",
]

[dependency-groups]
# fonttools/brotli 只给 scripts/convert_font.py 用（woff2 -> ttf），运行时不需要
dev = ["ruff", "fonttools>=4.53", "brotli>=1.1"]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Qt 类文件命名惯例（MainWindow 类与文件名同名）
"app/MainWindow.py" = ["N999"]
