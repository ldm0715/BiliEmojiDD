[project]
name = "bili-emoji-dd"
# 版本号唯一来源：app/common/version.py::project_version 在运行时读这里，
# packaging/build.py 也读这里。改版本只改这一行。
version = "0.1.4"
description = "B站表情包与收藏集下载器（PySide6 + QFluentWidgets + biliemoji）"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "gcnanmu" }]
dependencies = [
    "biliemoji==2.0.0",
    "PySide6==6.4.2",
    "PySide6-Fluent-Widgets @ git+https://github.com/ldm0715/PyQt-Fluent-Widgets@PySide6",
    # requests 的 socks 支持（requests[socks]）：代理地址写 socks5:// 时要靠它，
    # 没它直接抛 InvalidSchema
    "PySocks>=1.7.1",
    # 扫码登录的二维码编码（app/components/login_dialog.py）。纯 Python、零传递依赖，
    # 只用来算编码矩阵，绘制交给 QPainter——所以不需要 Pillow，也不做 PNG 解码。
    "segno>=1.6",
]

[dependency-groups]
# nuitka 只在打包时用（packaging/build.py）。2.x 才有 --windows-console-mode，
# 1.x 是已废弃的 --windows-disable-console
dev = ["ruff", "nuitka>=2.4"]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Qt 类文件命名惯例（MainWindow 类与文件名同名）
"app/MainWindow.py" = ["N999"]
